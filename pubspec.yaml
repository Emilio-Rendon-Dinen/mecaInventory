name: meca_inventory
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  synchronized: ^3.3.0+3
  path: ^1.9.0
  bloc: ^9.0.0
  flutter_bloc: ^9.0.0
  get_it: ^8.0.3
  flutter_slidable: ^4.0.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  permission_handler: ^12.0.1
  flutter_native_splash: ^2.4.7
  device_info_plus: ^11.5.0
  flutter_launcher_icons: ^0.14.4
  intl: any
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#F5F5F5"
  image: assets/images/logo.png
  android: false
  ios: true
  web: false

flutter_launcher_icons:
  ios: true
  android: false
  image_path: "assets/images/logo.png"
